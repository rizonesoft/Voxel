name: Plan and design

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Plan valid, design files well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The TODO tree is valid
        run: python scripts/todo-graph.py validate --all
      - name: The generated plan is current
        run: python scripts/todo-graph.py plan --check
      - name: Every screen has a picture and a contract
        run: python scripts/check-design.py
