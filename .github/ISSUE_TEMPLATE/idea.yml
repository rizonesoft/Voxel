name: An idea
description: Something Voxel should do, or do differently
labels: [idea]
body:
  - type: dropdown
    id: who
    attributes:
      label: Who is it for?
      options: [A patient looking at their own scan, A clinician reviewing a study, Both]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should Voxel do?
      description: Say what you are trying to get done, not only the feature
    validations:
      required: true
